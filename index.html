<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timer Rental PS</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#101522;color:#f5f7ff;font-family:Arial,sans-serif}
h1{text-align:center}
.room{background:#1b2436;border:1px solid #303d56;border-radius:14px;padding:16px;margin:14px auto;max-width:500px}
.time{font-size:38px;font-weight:bold;text-align:center;margin:18px}
select,button{width:100%;padding:12px;margin:5px 0;border:0;border-radius:8px;font-size:16px}
select{background:#303d56;color:white}
button{background:#3978f6;color:white;font-weight:bold}
button.stop{background:#c43d4b}
.status{text-align:center;color:#b8c7e8}
</style>
</head>
<body>
<h1>🎮 Timer Rental PS</h1>
<div id="rooms"></div>
<script>
const sessions = {};
const roomNames = ["Ruangan 1","Ruangan 2","Ruangan 3","Ruangan 4"];

function formatTime(seconds){
  seconds = Math.max(0, seconds);
  const h = Math.floor(seconds/3600);
  const m = Math.floor((seconds%3600)/60);
  const s = seconds%60;
  return [h,m,s].map(n=>String(n).padStart(2,"0")).join(":");
}

function draw(){
  document.getElementById("rooms").innerHTML = roomNames.map((name,i)=>`
    <div class="room">
      <h2>${name}</h2>
      <select id="duration${i}">
        <option value="3600">1 Jam</option>
        <option value="7200">2 Jam</option>
        <option value="10800">3 Jam</option>
      </select>
      <div class="time" id="time${i}">01:00:00</div>
      <div class="status" id="status${i}">Belum dimulai</div>
      <button onclick="start(${i})">Mulai Timer</button>
      <button onclick="pause(${i})">Jeda / Lanjutkan</button>
      <button onclick="addTime(${i})">Tambah 10 Menit</button>
      <button class="stop" onclick="finish(${i})">Selesai / Reset</button>
    </div>
  `).join("");
}

function start(i){
  const x=sessions[i];
  if(x && x.running) return;
  if(x && x.remaining>0){
    x.endAt=Date.now()+x.remaining*1000;
    x.running=true;
  }else{
    const duration=Number(document.getElementById("duration"+i).value);
    sessions[i]={remaining:duration,endAt:Date.now()+duration*1000,running:true,finished:false};
  }
  update();
}

function pause(i){
  const x=sessions[i];
  if(!x || x.finished) return;
  if(x.running){
    x.remaining=Math.max(0,Math.ceil((x.endAt-Date.now())/1000));
    x.running=false;
  }else if(x.remaining>0){
    x.endAt=Date.now()+x.remaining*1000;
    x.running=true;
  }
  update();
}

function addTime(i){
  const x=sessions[i];
  if(!x || x.finished) return;
  if(x.running){
    x.endAt+=600000;
  }else{
    x.remaining+=600;
  }
  update();
}

function finish(i){
  delete sessions[i];
  document.getElementById("time"+i).textContent=
    formatTime(Number(document.getElementById("duration"+i).value));
  document.getElementById("status"+i).textContent="Belum dimulai";
}

function update(){
  roomNames.forEach((name,i)=>{
    const x=sessions[i];
    if(!x) return;
    if(x.running){
      x.remaining=Math.max(0,Math.ceil((x.endAt-Date.now())/1000));
      if(x.remaining===0){
        x.running=false;
        x.finished=true;
        alert(name+" — WAKTU HABIS!");
      }
    }
    document.getElementById("time"+i).textContent=formatTime(x.remaining);
    document.getElementById("status"+i).textContent=
      x.finished?"Waktu habis":x.running?"Sedang berjalan":"Dijeda";
  });
}
draw();
setInterval(update,1000);
</script>
</body>
</html>
